<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 300px; font-family: system-ui, sans-serif; font-size: 13px; margin: 0; padding: 12px; }
    h1 { font-size: 15px; margin: 0 0 10px; }
    .row { display: flex; align-items: center; margin: 6px 0; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 8px; }
    .ok { background: #2ecc71; }
    .warn { background: #e67e22; }
    .err { background: #e74c3c; }
    input { width: 70px; padding: 4px; margin-left: 8px; }
    button { margin-top: 8px; padding: 6px 10px; cursor: pointer; }
    #statusText { font-weight: 600; }
    #error { color: #e74c3c; white-space: pre-wrap; }
    #tab { color: #555; word-break: break-all; }
    .hint { color: #888; font-size: 11px; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>Browser MCP</h1>
  <div class="row">
    <span id="dot" class="dot warn"></span>
    <span id="statusText">Connecting…</span>
  </div>
  <div class="row">
    <label for="port">Port</label>
    <input id="port" type="number" value="18765" min="1" max="65535" />
  </div>
  <button id="toggle">Connect</button>
  <div id="error"></div>
  <div id="tab"></div>
  <div class="hint">The MCP server must be running on this machine (ws://127.0.0.1:PORT/ws). Tools act on the active tab.</div>
  <script src="popup.js"></script>
</body>
</html>
